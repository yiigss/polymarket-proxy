name: Place Polymarket Bet
on:
  workflow_dispatch:
    inputs:
      side:
        description: '"up" or "down"'
        required: true
        type: string
      amount:
        description: 'Amount in USDC'
        required: true
        type: string
      candle_time_ms:
        description: 'Candle open time ms'
        required: true
        type: string
jobs:
  place-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Connect to NordVPN Switzerland via WireGuard
        env:
          NORDVPN_EMAIL:    ${{ secrets.NORDVPN_EMAIL }}
          NORDVPN_PASSWORD: ${{ secrets.NORDVPN_PASSWORD }}
        run: |
          set -e
          echo "==> Fetching NordVPN access token..."
          TOKEN=$(curl -s -X POST "https://api.nordvpn.com/v1/users/tokens" \
            -H "Authorization: Basic $(echo -n "${NORDVPN_EMAIL}:${NORDVPN_PASSWORD}" | base64 -w0)" \
            -H "Content-Type: application/json" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "Token OK (${#TOKEN} chars)"
          echo "==> Fetching WireGuard private key..."
          WG_PRIVATE_KEY=$(curl -s \
            -H "Authorization: token:${TOKEN}" \
            "https://api.nordvpn.com/v1/users/services/credentials" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['nordlynx_private_key'])")
          echo "Private key OK (${#WG_PRIVATE_KEY} chars)"
          echo "==> Finding best NordVPN Switzerland WireGuard server..."
          SERVER_JSON=$(curl -s "https://api.nordvpn.com/v1/servers/recommendations?filters\[servers_technologies\]\[identifier\]=wireguard_udp&filters\[country_id\]=209&limit=1")
          SERVER_IP=$(echo "$SERVER_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['station'])")
          SERVER_PUBKEY=$(echo "$SERVER_JSON" | python3 -c "
          import sys,json
          s=json.load(sys.stdin)[0]
          wg=[t for t in s['technologies'] if t['identifier']=='wireguard_udp'][0]
          print(next(m['value'] for m in wg['metadata'] if m['name']=='public_key'))
          ")
          echo "Server: ${SERVER_IP} pubkey=${SERVER_PUBKEY:0:20}..."
          echo "==> Building WireGuard config..."
          sudo mkdir -p /etc/wireguard
          sudo bash -c "cat > /etc/wireguard/wg0.conf" <<EOF
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = 10.5.0.2/32
          [Peer]
          PublicKey = ${SERVER_PUBKEY}
          Endpoint = ${SERVER_IP}:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          echo "==> Bringing up WireGuard..."
          sudo wg-quick up wg0
          echo "==> Verifying Swiss IP..."
          for i in $(seq 1 15); do
            sleep 1
            COUNTRY=$(curl -s --max-time 2 ipinfo.io/country 2>/dev/null || echo '??')
            echo "Attempt $i: country=$COUNTRY"
            if [ "$COUNTRY" = "CH" ]; then echo "VPN OK — Switzerland"; break; fi
            if [ "$i" = "15" ]; then echo "ERROR: not CH after WireGuard up"; sudo wg show; exit 1; fi
          done
      - name: Cache installed Python packages
        id: pylocal-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: pylocal-polymarket-v1-${{ runner.os }}
      - name: Install Python dependencies
        if: steps.pylocal-cache.outputs.cache-hit != 'true'
        run: pip3 install --quiet --pre 'polymarket-client>=0.1.0b3' requests PySocks
      - name: Place bet
        env:
          POLYMARKET_PRIVATE_KEY:    ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
        run: |
          python3 bet/bet.py \
            "${{ inputs.side }}" \
            "${{ inputs.amount }}" \
            "${{ inputs.candle_time_ms }}"
