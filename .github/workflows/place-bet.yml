name: Place Polymarket Bet
on:
  workflow_dispatch:
    inputs:
      side:
        description: '"up" or "down"'
        required: true
        type: string
      amount:
        description: 'Amount in USDC'
        required: true
        type: string
      candle_time_ms:
        description: 'Candle open time ms'
        required: true
        type: string
jobs:
  place-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenVPN
        run: sudo apt-get install -y -qq openvpn
      - name: Download NordVPN Switzerland config
        run: wget -q https://downloads.nordcdn.com/configs/files/ovpn_tcp/servers/ch198.nordvpn.com.tcp.ovpn -O ch.ovpn
      - name: Connect to NordVPN Switzerland
        run: |
          printf '%s\n%s\n' "${{ secrets.NORDVPN_USER }}" "${{ secrets.NORDVPN_PASS }}" > /tmp/vpncreds.txt
          chmod 600 /tmp/vpncreds.txt
          sudo openvpn --config ch.ovpn --auth-user-pass /tmp/vpncreds.txt --daemon --log /tmp/vpn.log
          for i in $(seq 1 20); do
            sleep 2
            COUNTRY=$(curl -s --max-time 3 ipinfo.io/country 2>/dev/null || echo '??')
            echo "Attempt $i: country=$COUNTRY"
            if [ "$COUNTRY" = "CH" ]; then echo "VPN OK — Switzerland"; break; fi
            if [ "$i" = "20" ]; then echo "ERROR: VPN timeout"; tail -20 /tmp/vpn.log; exit 1; fi
          done
      - name: Cache installed Python packages
        id: pylocal-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: pylocal-polymarket-v1-${{ runner.os }}
      - name: Install Python dependencies
        if: steps.pylocal-cache.outputs.cache-hit != 'true'
        run: pip3 install --quiet --pre 'polymarket-client>=0.1.0b3' requests PySocks
      - name: Place bet
        env:
          POLYMARKET_PRIVATE_KEY:    ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
        run: |
          python3 bet/bet.py \
            "${{ inputs.side }}" \
            "${{ inputs.amount }}" \
            "${{ inputs.candle_time_ms }}"
