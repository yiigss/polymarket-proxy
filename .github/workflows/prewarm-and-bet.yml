name: Pre-warm and Bet
on:
  workflow_dispatch:
    inputs:
      signal_url:
        description: "URL to poll for bet signal (e.g. https://<domain>/api/btc/bet-signal)"
        required: true
        type: string
      signal_var:
        description: "GitHub variable name to poll for the bet signal"
        required: false
        default: "BET_SIGNAL"
        type: string
jobs:
  prewarm-and-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenVPN
        run: sudo apt-get install -y -qq openvpn
      - name: Connect to NordVPN Switzerland
        run: |
          printf '%s\n%s\n' "${{ secrets.NORDVPN_USER }}" "${{ secrets.NORDVPN_PASS }}" > /tmp/vpncreds.txt
          chmod 600 /tmp/vpncreds.txt
          sudo openvpn --config vpn/ch.ovpn --auth-user-pass /tmp/vpncreds.txt --daemon --log /tmp/vpn.log
          for i in $(seq 1 40); do
            sleep 1
            COUNTRY=$(curl -s --max-time 2 ipinfo.io/country 2>/dev/null || echo '??')
            echo "Attempt $i: country=$COUNTRY"
            if [ "$COUNTRY" = "CH" ]; then echo "VPN OK — Switzerland"; break; fi
            if [ "$i" = "40" ]; then echo "ERROR: VPN timeout"; tail -20 /tmp/vpn.log; exit 1; fi
          done
      - name: Cache installed Python packages
        id: pylocal-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: pylocal-polymarket-v1-${{ runner.os }}
      - name: Install Python dependencies
        if: steps.pylocal-cache.outputs.cache-hit != 'true'
        run: pip3 install --quiet --pre 'polymarket-client>=0.1.0b3' requests PySocks
      - name: Wait for signal and place bet(s)
        env:
          POLYMARKET_PRIVATE_KEY:    ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
          SIGNAL_SECRET:             ${{ secrets.SIGNAL_SECRET }}
          GH_TOKEN:                  ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIGNAL_URL="${{ inputs.signal_url }}"
          SIGNAL_VAR="${{ inputs.signal_var }}"
          export REPORT_URL=$(echo "$SIGNAL_URL" | sed 's|/bet-signal|/balance-report|')
          ACK_URL=$(echo "$SIGNAL_URL" | sed 's|/bet-signal.*|/bet-signal|')
          echo "Runner warm -- VPN connected, Python ready."
          echo "Polling GitHub variable $SIGNAL_VAR (ack -> $ACK_URL)"

          # Record initial value so we only fire on NEW signals
          LAST_SEEN=$(gh api /repos/yiigss/polymarket-proxy/actions/variables/$SIGNAL_VAR --jq '.value' 2>/dev/null || echo "none")
          echo "[Signal] Initial value: $LAST_SEEN"
          LAST_BET_CANDLE=""
          polls=0

          while [ $polls -lt 3600 ]; do
            polls=$((polls + 1))
            CURRENT=$(gh api /repos/yiigss/polymarket-proxy/actions/variables/$SIGNAL_VAR --jq '.value' 2>/dev/null || echo "error")

            if [ "$CURRENT" = "error" ]; then
              sleep 1; continue
            fi

            if [ "$CURRENT" != "$LAST_SEEN" ]; then
              LAST_SEEN="$CURRENT"
              echo "[Signal] Changed -> $CURRENT"

              if echo "$CURRENT" | grep -q "^fire:"; then
                SIDE=$(echo "$CURRENT"      | cut -d: -f2)
                AMOUNT=$(echo "$CURRENT"    | cut -d: -f3)
                CANDLE_MS=$(echo "$CURRENT" | cut -d: -f4)

                if [ "$CANDLE_MS" = "$LAST_BET_CANDLE" ]; then
                  echo "[Signal] Duplicate candle $CANDLE_MS -- skipping"
                else
                  LAST_BET_CANDLE="$CANDLE_MS"
                  echo "[Signal] Placing bet: side=$SIDE amount=$AMOUNT candle=$CANDLE_MS"
                  python3 bet/bet.py "$SIDE" "$AMOUNT" "$CANDLE_MS"
                  echo "[Signal] bet.py exited with $?"
                  curl -s -X POST "$ACK_URL" \
                    -H "Content-Type: application/json" \
                    -H "x-signal-secret: ${SIGNAL_SECRET}" \
                    -d '{"status":"done"}' || true
                fi

              elif [ "$CURRENT" = "abort" ] || [ "$CURRENT" = "idle" ] || [ "$CURRENT" = "done" ]; then
                echo "[Signal] Received '$CURRENT' -- exiting"
                exit 0
              fi
            fi

            sleep 1
          done

          echo "[Signal] Timeout after 3600s -- exiting"
