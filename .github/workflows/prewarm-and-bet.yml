name: Pre-warm and Bet
on:
  workflow_dispatch:
    inputs:
      signal_url:
        description: "Legacy field — kept for backward compat, no longer used"
        required: true
        type: string
      signal_var:
        description: "GitHub repo variable to poll for signal (e.g. BET_SIGNAL)"
        required: false
        default: "BET_SIGNAL"
        type: string
jobs:
  prewarm-and-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenVPN
        run: sudo apt-get install -y -qq openvpn
      - name: Connect to NordVPN Switzerland
        run: |
          printf '%s\n%s\n' "${{ secrets.NORDVPN_USER }}" "${{ secrets.NORDVPN_PASS }}" > /tmp/vpncreds.txt
          chmod 600 /tmp/vpncreds.txt
          sudo openvpn --config vpn/ch.ovpn --auth-user-pass /tmp/vpncreds.txt --daemon --log /tmp/vpn.log
          for i in $(seq 1 40); do
            sleep 1
            COUNTRY=$(curl -s --max-time 2 ipinfo.io/country 2>/dev/null || echo '??')
            echo "Attempt $i: country=$COUNTRY"
            if [ "$COUNTRY" = "CH" ]; then echo "VPN OK — Switzerland"; break; fi
            if [ "$i" = "40" ]; then echo "ERROR: VPN timeout"; tail -20 /tmp/vpn.log; exit 1; fi
          done
      - name: Cache installed Python packages
        id: pylocal-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: pylocal-polymarket-v1-${{ runner.os }}
      - name: Install Python dependencies
        if: steps.pylocal-cache.outputs.cache-hit != 'true'
        run: pip3 install --quiet --pre 'polymarket-client>=0.1.0b3' requests PySocks
      - name: Wait for signal and place bet(s)
        env:
          POLYMARKET_PRIVATE_KEY:    ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
          SIGNAL_SECRET:             ${{ secrets.SIGNAL_SECRET }}
          GH_TOKEN:                  ${{ secrets.GITHUB_TOKEN }}
        run: |
          VAR_NAME="${{ inputs.signal_var }}"
          GH_REPO="yiigss/polymarket-proxy"
          echo "Runner warm — polling GitHub variable: $VAR_NAME"
          LAST_BET_CANDLE=""
          polls=0
          while [ $polls -lt 1800 ]; do
            polls=$((polls + 1))
            VALUE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}/actions/variables/${VAR_NAME}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('value','idle'))" 2>/dev/null || echo "idle")
            echo "Poll $polls: $VAR_NAME=$VALUE"
            if [[ "$VALUE" == fire:* ]]; then
              IFS=':' read -r _ SIDE AMOUNT CANDLE_MS NONCE <<< "$VALUE"
              if [ "$CANDLE_MS" = "$LAST_BET_CANDLE" ]; then
                echo "Already placed bet for candle $CANDLE_MS — waiting for next signal..."
                sleep 2
                continue
              fi
              echo "Firing bet: $SIDE \$$AMOUNT candle=$CANDLE_MS"
              python3 bet/bet.py "$SIDE" "$AMOUNT" "$CANDLE_MS"
              LAST_BET_CANDLE="$CANDLE_MS"
              echo "Bet placed — staying warm for martingale continuation..."
            elif [ "$VALUE" = "done" ]; then
              echo "Sequence complete — exiting"
              exit 0
            elif [ "$VALUE" = "abort" ]; then
              echo "Signal aborted — exiting cleanly"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: runner active for 60 min without completion"
          exit 1
