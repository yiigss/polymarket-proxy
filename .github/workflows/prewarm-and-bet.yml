name: Pre-warm and Bet
on:
  workflow_dispatch:
    inputs:
      signal_url:
        description: "Legacy field — kept for backward compat, no longer used"
        required: true
        type: string
      signal_var:
        description: "GitHub repo variable to poll for signal (e.g. BET_SIGNAL)"
        required: false
        default: "BET_SIGNAL"
        type: string

jobs:
  prewarm-and-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenVPN
        run: sudo apt-get install -y -qq openvpn

      - name: Select best NordVPN Switzerland server
        run: bash bet/pick-vpn-server.sh

      - name: Connect to NordVPN Switzerland
        run: |
          printf '%s\n%s\n' "${{ secrets.NORDVPN_USER }}" "${{ secrets.NORDVPN_PASS }}" > /tmp/vpnc
